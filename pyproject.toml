[project]
name = "cosmere-rag"
version = "0.1.0"
description = "RAG over Brandon Sanderson's Cosmere"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "pydantic>=2.13.3,<3",
    "python-dotenv>=1.2.2,<2",
]

[project.optional-dependencies]
serve = [
    "langchain>=1.2.15,<2",
    "langchain-core>=1.3.0,<2",
    "langchain-openai>=1.2.0,<2",
    "langgraph>=1.1.9,<2",
    "langsmith>=0.7.33,<1",
    "google-cloud-bigquery>=3.41.0,<4",
    "slack-bolt>=1.28.0,<2",
    "numpy>=2.4.4,<3",
]
build = [
    "tiktoken>=0.12.0,<1",
    "pyarrow>=24.0.0,<25",
    "numpy>=2.4.4,<3",
    "langchain-core>=1.3.0,<2",
    "langchain-openai>=1.2.0,<2",
    "langsmith>=0.7.33,<1",
    "google-cloud-bigquery>=3.41.0,<4",
]
eval = [
    "cosmere-rag[serve]",
    "langsmith>=0.7.33,<1",
]

[project.scripts]
cosmere-ingest-coppermind = "cosmere_rag.ingest.cli:main"
cosmere-embed = "cosmere_rag.embed.cli:main"
cosmere-index = "cosmere_rag.index.cli:main"
cosmere-eval = "cosmere_rag.eval.cli:main"
cosmere-ask = "cosmere_rag.agent.cli:main"
cosmere-slack = "cosmere_rag.slack.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cosmere_rag"]

[dependency-groups]
dev = [
    "pytest>=9.0.3,<10",
    "chromadb>=1.5.8,<2",
]
